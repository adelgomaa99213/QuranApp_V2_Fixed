name: Build Quran V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o "*.zip" -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd extracted_project/QuranApp || cd extracted_project
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon

      - name: Find and Verify APK
        run: |
          APK_FILE=$(find extracted_project -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          ls -lh "$APK_FILE"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1-${{ github.run_number }}
          name: QuranApp V2 Release (${{ github.run_number }})
          files: ${{ env.APK_PATH }}
